services:
  - type: web
    name: studybud
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn studybud.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: studybud_db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com,studybud-a6op.onrender.com
    autoDeploy: true

databases:
  - name: studybud_db
    plan: free
    databaseName: studybud
    user: studybud 