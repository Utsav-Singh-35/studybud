name: Deploy to Docker Hub

on:
  push:
    branches:
      - main  

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.dckr_pat_CyxxLoiBdcde-9PYGa8e5kMhJg4 }}" | docker login -u "${{ secrets.one }}" --password-stdin

      - name: Build Docker Image
        run: docker build -t one/studybud:latest .

      - name: Push Docker Image
        run: docker push one/studybud:latest